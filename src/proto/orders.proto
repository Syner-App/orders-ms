syntax = "proto3";

package orders;

service OrdersService {
  rpc Create (CreateOrderRequest) returns (Order);
  rpc FindAll (OrderPaginationRequest) returns (OrderList);
  rpc FindOne (OrderById) returns (Order);
  rpc ChangeOrderStatus (ChangeOrderStatusRequest) returns (Order);
}

enum OrderStatus {
  PENDING = 0;
  DELIVERED = 1;
  CANCELLED = 2;
  AWAITING_VALIDATION = 3; // order saga: waiting for products-ms
  REJECTED = 4;            // order saga: invalid products or validation timed out
}

message OrderById {
  string id = 1;
}

message OrderItem {
  int32 productId = 1;
  int32 quantity = 2;
  reserved 3;
}

message CreateOrderRequest {
  repeated OrderItem items = 1;
}

message OrderPaginationRequest {
  optional int32 page = 1;
  optional int32 limit = 2;
  optional OrderStatus status = 3;
}

message ChangeOrderStatusRequest {
  string id = 1;
  OrderStatus status = 2;
}

message Order {
  string id = 1;
  double totalAmount = 2;
  int32 totalItems = 3;
  OrderStatus status = 4;
  bool paid = 5;
  optional string paidAt = 6;
  string createdAt = 7;
  string updatedAt = 8;
  repeated OrderItemDetail items = 9;
  optional string rejectionReason = 10;
}

// price and name are set once products-ms validates the order
message OrderItemDetail {
  int32 productId = 1;
  int32 quantity = 2;
  optional double price = 3;
  optional string name = 4;
}

message PaginationMeta {
  int32 total = 1;
  int32 page = 2;
  int32 lastPage = 3;
}

message OrderList {
  repeated Order data = 1;
  PaginationMeta meta = 2;
}
