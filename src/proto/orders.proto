syntax = "proto3";

package orders;

// Field names are snake_case end to end (proto-loader keepCase + ts-proto
// snakeToCamel=false) so they match the Prisma columns
service PurchaseOrdersService {
  rpc Create (CreatePurchaseOrderRequest) returns (PurchaseOrder);
  rpc FindAll (PurchaseOrderPaginationRequest) returns (PurchaseOrderList);
  rpc FindOne (PurchaseOrderById) returns (PurchaseOrder);
  rpc UpdateStatus (UpdatePurchaseOrderStatusRequest) returns (PurchaseOrder);
}

enum StatusPurchaseOrder {
  EN_VALIDACION = 0; // purchase order saga: waiting for products-ms
  PENDIENTE = 1;
  APROBADA = 2;
  RECHAZADA = 3;
  RECIBIDA = 4;
}

message PurchaseOrderById {
  string id = 1;
}

message CreatePurchaseOrderRequest {
  int32 producto_id = 1;
  string proveedor = 2;
  int32 cantidad_solicitada = 3;
  optional string motivo = 4;
}

message PurchaseOrderPaginationRequest {
  optional int32 page = 1;
  optional int32 limit = 2;
  optional StatusPurchaseOrder estado = 3;
}

// Only APROBADA, RECHAZADA (motivo required) and RECIBIDA can be requested
message UpdatePurchaseOrderStatusRequest {
  string id = 1;
  StatusPurchaseOrder estado = 2;
  optional string motivo = 3;
}

message PurchaseOrder {
  string id = 1;
  StatusPurchaseOrder estado = 2;
  string proveedor = 3;
  int32 cantidad_solicitada = 4;
  optional string motivo = 5;
  int32 producto_id = 6;
  string createdAt = 7;
  optional string updatedAt = 8;
}

message PaginationMeta {
  int32 total = 1;
  int32 page = 2;
  int32 lastPage = 3;
}

message PurchaseOrderList {
  repeated PurchaseOrder data = 1;
  PaginationMeta meta = 2;
}
